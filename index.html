<!DOCTYPE html>
<html>
    <head>
        <title>PrivateOS</title>
        <link rel="stylesheet" href="style.css">
        <!-- Include Google Fonts CDN link -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    </head>
    <body class="backdrop">
        <div id="topbar"  class="topbar">
            <div id="branding" class="branding">
                <img src="./logo.webp" alt="PrivateOS Logo" class="logo">
            </div>
            <div id="Time" class="time"><span id="clock">Time</span></div>
            <div id="battery" class="battery"><span id="battery-level">100%</span></div>
        </div>
        <div id="notes" class="window">
            <div id="notesHeader" class="window-header">
                <div class="closeButton" onclick="closeWindow('#notes')"></div>
            </div>
            <div class="form">
                <textarea class="notes-form" id="notes-form" placeholder="Type notes here..." required></textarea>
                <div class="button-note-submit" onclick="downloadNote()"><p class="submit-text">Save Note</p></div>
            </div>
        </div>
        <div id="appdock" class="appdock">
            <div class="icons">
                <img src="./note-icon.png" alt="Notes Icon" class="app-icon-image" onclick="openWindow('#notes')">
            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
