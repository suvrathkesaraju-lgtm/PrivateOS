<!DOCTYPE html>
<html>
    <head>
        <title>PrivateOS</title>
        <link rel="stylesheet" href="style.css">
        <!-- Include Google Fonts CDN link -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    </head>

    <!-- Body -->

    <body class="backdrop">

        <!-- Top Bar -->

        <div id="topbar"  class="topbar">
            <div id="branding" class="branding">
                <img src="./logo.webp" alt="PrivateOS Logo" class="logo">
            </div>
            <div id="Time" class="time"><span id="clock">Time</span></div>
            <div id="battery" class="battery"><span id="battery-level">100%</span></div>
        </div>

        <!-- Notes Window -->

        <div id="notes" class="window">
            <div id="notesHeader" class="window-header">
                <div class="closeButton" onclick="closeWindow('#notes')"></div>
            </div>
            <div class="form">
                <textarea class="notes-form" id="notes-form" placeholder="Type notes here..." required></textarea>
                <div class="button-note-submit" onclick="downloadNote()"><p class="submit-text">Save Note</p></div>
            </div>
        </div>

        <!-- App Dock -->

        <div id="appdock" class="appdock">
            <div class="icons">
                <img src="./note-icon.png" alt="Notes Icon" class="app-icon-image" onclick="openWindow('#notes')">
                <img src="./audio-icon.png" alt="Audio Icon" class="app-icon-image" onclick="openWindow('#audioPlayer')">
                
            </div>

        </div>

        <!-- Audio Player -->
         <div id="audioPlayer" class="window">
            <div id="audioPlayerHeader" class="window-header">
                <div class="closeButton" onclick="closeWindow('#audioPlayer')"></div>
            </div>
            <div class="form">
                    <div class="filename" id="filename">No File Selected</div>
                    <div class="file-selector">
                        <input type="file" id="fileInput" accept="audio/*" class="file-selector">
                        <p style="color: white;">Click Here to Select File or Change File</p>
                    </div>
                    
                    <div class="playbar-row">
                        <span class="current-time-audio" id="current-time-audio">0:00</span>
                        <input type="range" id="time-bar" value="0" min="0" max="100" step="0.1">
                        <span class="remaining-time-audio" id="remaining-time-audio">0:00</span>
                    </div>
                    <div class="controls">
                        <button id="playbtn" disabled aria-label="Play">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                    <audio id="audio"></audio>
                </div>
         </div>
        <!-- scripts-->

        <script src="script.js"></script>
    </body>

</html>
